[project]
name = "hospitalcare"
version = "0.1.0"
description = "HospitalCare AI - agentic outpatient triage workflow assistant (synthetic-data prototype)"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.162.0",
    "httpx==0.28.1",
    "langgraph==1.2.18",
    "langgraph-checkpoint-sqlite==3.1.2",
    "mcp==2.3.0",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.2",
    "pyyaml==6.0.3",
    "uvicorn==0.54.0",
]

[build-system]
requires = ["uv_build>=0.11.11,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1",
]

[project.scripts]
hcai = "hospitalcare.cli:main"
hcai-mcp = "hospitalcare.mcp_server.server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "model: requires the local Ollama model (skipped with HCAI_SKIP_MODEL_TESTS=1)",
    "filesystem_mcp: requires Node and the pinned Filesystem MCP server",
]
